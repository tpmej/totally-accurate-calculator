<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <h1><code>Totally accurate calculator!</code></h1>
    <div class="container">
        <input type="text" id="screen" disabled>
        <div class="button-row">
            <button class="button" onclick="addNumber('1')"><code>1</code></button>
            <button class="button" onclick="addNumber('2')"><code>2</code></button>
            <button class="button" onclick="addNumber('3')"><code>3</code></button>
            <button class="button" onclick="addOperator('*')"><code>*</code></button>
        </div>
        <div class="button-row">
            <button class="button" onclick="addNumber('4')"><code>4</code></button>
            <button class="button" onclick="addNumber('5')"><code>5</code></button>
            <button class="button" onclick="addNumber('6')"><code>6</code></button>
            <button class="button" onclick="addOperator('+')"><code>+</code></button>
        </div>
        <div class="button-row">
            <button class="button" onclick="addNumber('7')"><code>7</code></button>
            <button class="button" onclick="addNumber('8')"><code>8</code></button>
            <button class="button" onclick="addNumber('9')"><code>9</code></button>
            <button class="button" onclick="addOperator('-')"><code>-</code></button>
        </div>
        <div class="button-row">
            <button class="clear-button" onclick="clearScreen()"><code>C</code></button>
            <button class="button" onclick="addNumber('0')"><code>0</code></button>
            <button class="button" onclick="addOperator('/')"><code>/</code></button>
            <button class="button" onclick="calculate()"><code>=</code></button>
        </div>
    </div>
</body>
</html>
